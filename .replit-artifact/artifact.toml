kind = "web"
previewPath = "/"
title = "CyberSafe"
version = "1.0.0"
id = "artifacts/cybersafe"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20136

[services.development]
run = "pnpm --filter cyrix run dev"

[services.production]
build = [ "pnpm", "--filter", "cyrix", "run", "build" ]
serve = "static"
publicDir = "artifacts/cybersafe/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20136"
BASE_PATH = "/"
